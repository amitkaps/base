[tools]
node = "latest"
# Use pnpm's official standalone binary from GitHub releases. The bare `pnpm`
# alias currently resolves to an aqua registry entry that lacks a darwin-x64
# build for pnpm 12; `github:pnpm/pnpm` ships every platform.
"github:pnpm/pnpm" = "12.4.0"

[env]
NODE_ENV = "development"

[tasks.dev]
description = "Start the dev server"
run = "pnpm dev"

[tasks.check]
description = "Format check + lint + typecheck + svelte-check"
run = ["pnpm check", "pnpm check:svelte"]

[tasks.test]
description = "Run unit tests"
run = "pnpm test"

[tasks.build]
description = "Production build (Cloudflare)"
run = "pnpm build"
