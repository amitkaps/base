name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Vite+, the Node version from package.json, and pnpm.
      # Replaces setup-node + pnpm/action-setup + dependency caching.
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true

      - run: vp install

      - name: Format, lint, typecheck
        run: pnpm run check

      - name: Svelte diagnostics
        run: pnpm run check:svelte

      - name: Unit tests
        run: vp test --run

      - name: Build (Cloudflare adapter)
        run: vp build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true

      - run: vp install
      - run: vp build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
