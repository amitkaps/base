version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Kit 3 and svelte-check don't support TypeScript 7 yet — see lessons.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Vite+ moves in every repository at once, with its override in
      # pnpm-workspace.yaml, which Dependabot doesn't edit — see upgrade.md.
      - dependency-name: vite-plus
    groups:
      sveltekit:
        patterns:
          - "@sveltejs/*"
          - svelte
          - svelte-check
          - typescript
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
