version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      # One PR for the whole toolchain so the RC/beta pieces move together.
      sveltekit:
        patterns:
          - '@sveltejs/*'
          - svelte
          - svelte-check
      vite-plus:
        patterns:
          - vite
          - vite-plus
          - vitest
      content-collections:
        patterns:
          - '@content-collections/*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
