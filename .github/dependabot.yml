version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Kit 3 and svelte-check don't support TypeScript 7 yet — see lessons.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      sveltekit:
        patterns:
          - "@sveltejs/*"
          - svelte
          - svelte-check
          - typescript
      vite-plus:
        patterns:
          - vite-plus
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
